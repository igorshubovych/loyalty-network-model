<svg height="662pt" viewBox="30 0 960 662" width="960pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><marker id="a" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><path d="m0 0 10 3.5-10 3.5z"/></marker><rect fill="#fff" height="100%" width="100%"/><rect fill="#fff" height="150" rx="8" stroke="#000" stroke-width="2" width="300" x="330" y="10"/><text font="bold 16px 'Times New Roman', Times, serif" x="345" y="34">ВХОДИ U (щотік)</text><g font="16px 'Times New Roman', Times, serif"><text x="345" y="58">внутрішня мотивація</text><text x="345" y="78">звичка (habit)</text><text x="345" y="98">винагорода (salience)</text><text x="345" y="118">думка (opinion)</text><text x="345" y="138">конформність сусідів</text><text x="345" y="158">− ціна вибору</text></g><path d="m480 180 150 70-150 70-150-70z" fill="#fff" stroke="#000" stroke-width="2"/><text font="bold 20px 'Times New Roman', Times, serif" text-anchor="middle" x="480" y="244">P(TARGET)</text><text font="16px 'Times New Roman', Times, serif" text-anchor="middle" x="480" y="268">= σ(β·U)</text><rect fill="#fff" height="160" rx="8" stroke="#000" stroke-width="2" width="300" x="100" y="390"/><text font="bold 20px 'Times New Roman', Times, serif" text-anchor="middle" x="250" y="418">NON-TARGET</text><path d="m100 430h300" stroke="#000"/><text font="16px 'Times New Roman', Times, serif" x="112" y="452">entry / habit ← 0</text><text font="16px 'Times New Roman', Times, serif" x="112" y="474">entry / satisfaction = −0.25</text><text font="16px 'Times New Roman', Times, serif" x="112" y="496">мотивація без змін</text><rect fill="#fff" height="160" rx="8" stroke="#000" stroke-width="2" width="300" x="560" y="390"/><text font="bold 20px 'Times New Roman', Times, serif" text-anchor="middle" x="710" y="418">TARGET</text><path d="m560 430h300" stroke="#000"/><text font="16px 'Times New Roman', Times, serif" x="572" y="452">entry / habit ← 1</text><text font="16px 'Times New Roman', Times, serif" x="572" y="474">entry / satisfaction ↑</text><text font="16px 'Times New Roman', Times, serif" x="572" y="496">salience ≤ 0.60 → мотивація ↑</text><text font="16px 'Times New Roman', Times, serif" x="572" y="518">salience &gt; 0.60 → мотивація ↓</text><path d="m480 160v20" fill="none" marker-end="url(#a)" stroke="#000" stroke-width="2"/><text font="18px 'Times New Roman', Times, serif" x="486" y="173">U</text><path d="m480 320v40h-230v30" fill="none" marker-end="url(#a)" stroke="#000" stroke-width="2"/><text font="18px 'Times New Roman', Times, serif" x="365" y="353">1−p</text><path d="m480 320v40h230v30" fill="none" marker-end="url(#a)" stroke="#000" stroke-width="2"/><text font="18px 'Times New Roman', Times, serif" x="595" y="353">p</text><path d="m100 470h-60v-220h290" fill="none" marker-end="url(#a)" stroke="#000" stroke-width="2"/><text font="18px 'Times New Roman', Times, serif" x="46" y="360">тік+1</text><path d="m860 470h60v-220h-290" fill="none" marker-end="url(#a)" stroke="#000" stroke-width="2"/><text font="18px 'Times New Roman', Times, serif" x="926" y="360">тік+1</text><rect fill="#fff" height="80" rx="6" stroke="#888" stroke-dasharray="8 8" stroke-width="1.5" width="880" x="40" y="572"/><text font="bold 16px 'Times New Roman', Times, serif" x="52" y="594">ПАРАЛЕЛЬНО (окремий процес щотік, не залежить від chose-target?)</text><text font="16px 'Times New Roman', Times, serif" x="52" y="616">якщо wom-on?: opinion → satisfaction, потім HK-усереднення з сусідами</text><text font="16px 'Times New Roman', Times, serif" x="52" y="638">окремо щотік оновлюється neighbor-target-share (для конформності на наступному тіку)</text></svg>